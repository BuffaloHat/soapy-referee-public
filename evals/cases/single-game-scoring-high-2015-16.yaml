id: single-game-scoring-high-2015-16
question: Who scored the most points in a single regular-season game in 2015-16, and how many points was it?

tier: hard
traps: [play-by-play-only, duplicate-rows]
expects: rows
cardinality: 1

# There are no player box scores. Points come from play_by_play events:
# made field goals (type 1, three points if the text says 3PT) and made free
# throws (type 3, not marked MISS). Regular-season 2015-16 game ids start 00215.
gold_sql: |
  WITH events AS (
      SELECT DISTINCT game_id, eventnum, eventmsgtype, player1_id,
             coalesce(homedescription, '') || ' ' || coalesce(visitordescription, '') AS description
      FROM nba.play_by_play
      WHERE game_id LIKE '00215%'
  ),
  points AS (
      SELECT game_id, player1_id,
             CASE WHEN eventmsgtype = 1 AND description LIKE '%3PT%' THEN 3
                  WHEN eventmsgtype = 1 THEN 2
                  WHEN eventmsgtype = 3 AND description NOT LIKE '%MISS%' THEN 1
                  ELSE 0
             END AS pts
      FROM events
  )
  SELECT player1_id AS player_id, sum(pts) AS points
  FROM points
  GROUP BY game_id, player1_id
  ORDER BY points DESC
  LIMIT 1

# Same answer without scoring rules: each scoring description carries the
# player's running total, "(60 PTS)". The largest per player per game is
# the game total.
check_sql: |
  WITH running AS (
      SELECT game_id, player1_id,
             TRY_CAST(regexp_extract(
                 coalesce(homedescription, '') || ' ' || coalesce(visitordescription, ''),
                 '\((\d+) PTS\)', 1) AS INTEGER) AS running_pts
      FROM nba.play_by_play
      WHERE game_id LIKE '00215%' AND eventmsgtype IN (1, 3)
  )
  SELECT player1_id, max(running_pts)
  FROM running
  GROUP BY game_id, player1_id
  ORDER BY 2 DESC NULLS LAST
  LIMIT 1

contract:
  players: [player_id]

provenance: >
  Published record: Kobe Bryant's 60 points in his final game (April 13,
  2016) was the 2015-16 regular-season high. Two independent derivations
  agree, and both reproduce the published top five (Bryant 60, Davis 59,
  Butler 53, Curry 53, Walker 52).

notes: >
  Hard tier: the answer has to be built from play-by-play events. Scoring
  every made shot as two points puts Anthony Davis first with 57; counting
  missed free throws gives Bryant 62. The 73 duplicated events that season
  do not touch the top games. play_by_play covers 1,121 of the season's
  1,230 games; the published high is among them. The running score column
  was rejected as a check route — period events carry scores, and some games
  have scores out of order.
